<!DOCTYPE html>
<html>
<head>
<script>
  function print_result() {
    /* --- (f) --- */
    var name=document.f1.name.value
    alert("Name is"+name)
    var age=document.f1.age.value
    alert("Age is"+age)

    var url=document.f1.url.value
    alert("Url is"+url)

    var time=document.f1.time.value
    alert("Rank is"+time)
    var color=document.f1.color.value
    alert("Color is"+color)
    
    var gender=document.f1.gender.value
    if(document.f1.gender[0].checked)
      gender=document.f1.gender[0].value
    else
      gender=document.f1.gender[1].value
    alert("Your Gender is"+gender)




    var index=document.f1.sport.selectedIndex
    var sport_text=document.f1.sport.options[index].text
    alert("Sport is"+sport_text)

 
  }
  
</script>
<title>Join Us</title>
<link rel="stylesheet" href="MainPage.css">
<link rel="stylesheet" href="Join Us.css">
</head>


<body>

  <div class="header"><!--set as a menu no move if needed-->
  <nav class="container" role="navigation">
        <img src="MosterIcon/MHWilds-Logo.png">
        <a class="box" href="MainPage.html">Home</a>
        <a class="box" href="Classification_page.html">Classification</a>
        <a class="box" href="Map.html">Map</a>
        <a class="box" href="Join Us.html">Join Us</a>
  </div>

  <form name="f1" onSubmit="print_result()" class="from">
    <table>
      <tr>
        <td>Name</td>
        <td>
          <input type="text" name="name" pattern="^[A-Z][a-z]*"
                 title="Capital first character" />
        </td>
      </tr>

      <tr>
        <td>Age</td>
        <td>

          <input type="number" name="age" min="16" max="80" required="required"/>
        </td>
      </tr>

      <tr>
        <td>Website Address</td>
        <td>

          <input type="url" name="url" title="http://domainName" required="required"/>
        </td>
      </tr>

      <tr>
        <td>Now Hunter Rank</td>
        <td>

          <input type="text" title="HH:MM:SS" name="time" required="required"
                 pattern="(01?/D| 2[0-3] : (0-5)?/D : (0-5)?/D )" />
               
        </td>
      </tr>

      <tr>
        <td>Favorite color in color code</td>
        <td>

          <input type="text" title="#hhh or #hhhhhh" name="color" required="required"
                 pattern="^#([0-9 a-f A-F](3) | [0-9 a-f A-F](6) )" />

        </td>
      </tr>

      <tr>
        <td>Gender</td>
        <td>
          <input type="radio" name="gender" value="M" required="required" />Male
          <input type="radio" name="gender" value="F" />Female
        </td>  
      </tr>

  

      <tr>
        <td>Favorite Monster Type</td>
        <td>
          <select name="Type">
            <option value="">Please select one type</option>
            <option value="Amp">Amphibians</option>
            <option value="BiW">Bird Wyverns</option>
            <option value="BrW">Brute Wyvern</option>
            <option value="FaB">Fanged Beasts</option>
            <option value="Con">Constructs</option>
            <option value="FlW">Flying Wyverns</option>
            <option value="Lev">Leviathans</option>
            <option value="Tem">Temnocerans</option>
            <option value="Cep">Cephalopods</option>
            <option value="Non">Gore_Magala</option>
          </select>
        </td>  
      </tr>
    </table>
    <br />

    <input type="submit" value="Submit" />
    <input type="reset" value=" reset ">
  </form>

</body>
</html>
