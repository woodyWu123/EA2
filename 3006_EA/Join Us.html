<!DOCTYPE html>
<html>
<head>
<script>
  function print_result() {
    /* --- (f) --- */
    var name=document.f1.name.value
    alert("Name is"+name)
    var age=document.f1.age.value
    alert("Age is"+age)

    var url=document.f1.url.value
    alert("Url is"+url)

    var time=document.f1.time.value
    alert("Time is"+time)
    var color=document.f1.color.value
    alert("Color is"+color)
    
    var gender=document.f1.gender.value
    if(document.f1.gender[0].checked)
      gender=document.f1.gender[0].value
    else
      gender=document.f1.gender[1].value
    alert("Your Gender is"+gender)

    var dse_len=document.f1.dse.length
    for(var i=0; i<dse_len;i++){
      if(document.f1.dse[1].checked){
      dse=dse+document.f1.dse[1].value + " "
      }
    }
    alert("dse is"+dse)


    var index=document.f1.sport.selectedIndex
    var sport_text=document.f1.sport.options[index].text
    alert("Sport is"+sport_text)

 
  }
</script>
</head>


<body>
  <form name="f1" onSubmit="print_result()">
    <table>
      <tr>
        <td>Name</td>
        <td>
          <!-- (a) -->
          <input type="text" name="name" pattern="^[A-Z][a-z]*"
                 title="Capital first character" />
        </td>
      </tr>

      <tr>
        <td>Age</td>
        <td>
          <!-- (b) -->
          <input type="number" name="age" min="18" max="80" required="required"/>
        </td>
      </tr>

      <tr>
        <td>Website Address</td>
        <td>
          <!-- (c) -->
          <input type="url" name="url" title="http://domainName" required="required"/>
        </td>
      </tr>

      <tr>
        <td>Wake up Time</td>
        <td>
          <!-- (d) -->
          <input type="text" title="HH:MM:SS" name="time" required="required"
                 pattern="(01?/D| 2[0-3] : (0-5)?/D : (0-5)?/D )" />
                 <!--pattern="([01]?[0-9]2[0-3] : ([0-5]?[0-9]) : ([0-5]?[0-9]) )" -->
        </td>
      </tr>

      <tr>
        <td>Favorite color in color code</td>
        <td>
          <!-- (e) -->
          <input type="text" title="#hhh or #hhhhhh" name="color" required="required"
                 pattern="^#([0-9 a-f A-F](3) | [0-9 a-f A-F](6) )" />

        </td>
      </tr>

      <tr>
        <td>Gender</td>
        <td>
          <input type="radio" name="gender" value="M" required="required" />Male
          <input type="radio" name="gender" value="F" />Female
        </td>  
      </tr>

      <tr>
        <td>DSE Subjects</td>
        <td>
          <input type="checkbox" name="dse" value="eng" />English Language
          <input type="checkbox" name="dse" value="chi" />Chinese Language
          <input type="checkbox" name="dse" value="math" />Mathematics
          <br />
          <input type="checkbox" name="dse" value="geo" />Geography
          <input type="checkbox" name="dse" value="csci" />Combined Science
        </td>
      </tr>

      <tr>
        <td>Favorite Sports</td>
        <td>
          <select name="sport">
            <option value="">Please select one sport</option>
            <option value="fb">Football</option>
            <option value="sw">Swimming</option>
            <option value="jg">Jogging</option>
            <option value="cy">Cycling</option>
          </select>
        </td>  
      </tr>
    </table>
    <br />

    <input type="submit" value="Submit" />
  </form>

</body>
</html>
